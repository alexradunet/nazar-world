<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020604" />
    <title>ASCII // VR</title>
  </head>
  <body>
    <div id="app"></div>
    <aside class="hud" aria-label="Game instructions">
      <p class="eyebrow">EXPERIMENT 001</p>
      <h1>ASCII // VR</h1>
      <p id="status">Generating glyph field…</p>
      <div class="controls">
        <span><kbd>WASD</kbd> move</span>
        <span><kbd>MOUSE</kbd> look</span>
        <span><kbd>SPACE</kbd> shift color</span>
        <span><kbd>TRIGGER</kbd> shift color</span>
      </div>
      <p class="hint">Click the world to enter desktop mode.</p>
    </aside>
    <div class="reticle" aria-hidden="true">+</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
